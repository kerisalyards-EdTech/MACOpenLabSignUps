<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursing Open Lab Sign-Up</title>
<style>
  :root {
    /* Mount Aloysius College brand palette */
    --mac-blue: #095398;      /* primary */
    --mac-lightblue: #24abe2; /* accent — border/icon use only, fails AA as text-on-white or bg-behind-white-text */
    --mac-purple: #9a52a0;    /* accent */
    --mac-navy: #051d3c;      /* deep navy — highest contrast, headings */
    --mac-white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f7fb;
    color: #1b2733;
    padding: 20px;
    line-height: 1.4;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header h1 {
    font-size: 1.7rem;
    color: var(--mac-navy);
    margin-bottom: 6px;
  }

  .header p {
    color: #4a5a68;
    font-size: 0.98rem;
  }

  .status-banner {
    background: #ffffff;
    border-left: 4px solid var(--mac-blue);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.92rem;
    color: #33475b;
    display: none;
  }
  .status-banner.show { display: block; }
  .status-banner.error { border-left-color: #c0392b; color: #7a2418; background:#fdecea; }
  .status-banner.success { border-left-color: #1e8e5a; color: #0e4d31; background:#e9f8f0; }

  .day-card {
    background: white;
    border-radius: 10px;
    border-left: 4px solid var(--mac-lightblue);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .day-card summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 18px;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--mac-navy);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #eaf3fb;
  }
  .day-card summary::-webkit-details-marker { display: none; }
  .day-card summary .chev { transition: transform 0.2s; font-size: 0.85rem; color: var(--mac-blue); }
  .day-card[open] summary .chev { transform: rotate(90deg); }

  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    padding: 16px 18px;
  }

  .slot-btn {
    border: 2px solid #d5dee4;
    background: #fff;
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 0.88rem;
    color: #1b2733;
    transition: border-color 0.15s, background 0.15s;
  }
  .slot-btn:hover:not(:disabled) {
    border-color: var(--mac-blue);
    background: #eef8fd;
  }
  .slot-btn .time { font-weight: 600; display: block; margin-bottom: 4px; }
  .slot-btn .spots { font-size: 0.78rem; color: #5b6b78; }

  .slot-btn.low .spots { color: #b8860b; font-weight: 600; }
  .slot-btn.full {
    background: #f5f5f5;
    border-color: #e0e0e0;
    color: #9aa4ab;
    cursor: not-allowed;
  }
  .slot-btn.full .spots { color: #b23a3a; font-weight: 600; }

  .slot-btn.selected {
    border-color: var(--mac-blue);
    background: var(--mac-blue);
    color: white;
  }
  .slot-btn.selected .spots { color: #d9ecf3; }

  .empty-note {
    padding: 16px 18px;
    color: #6b7b87;
    font-size: 0.9rem;
  }

  .signup-panel {
    background: white;
    border-radius: 10px;
    border-left: 4px solid var(--mac-purple);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 18px;
    margin-top: 4px;
    display: none;
  }
  .signup-panel.show { display: block; }

  .signup-panel h2 {
    font-size: 1.1rem;
    color: var(--mac-navy);
    margin-bottom: 4px;
  }
  .signup-panel .selected-slot-label {
    font-size: 0.9rem;
    color: #4a5a68;
    margin-bottom: 16px;
  }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    color: #33475b;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #d5dee4;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--mac-blue);
  }

  .btn-row { display: flex; gap: 10px; margin-top: 18px; }

  .btn-primary, .btn-secondary {
    padding: 11px 18px;
    border-radius: 7px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: var(--mac-blue);
    color: white;
    flex: 1;
  }
  .btn-primary:hover:not(:disabled) { background: var(--mac-navy); }
  .btn-primary:disabled { background: #a9b7bf; cursor: not-allowed; }

  .btn-secondary {
    background: #eef1f3;
    color: #33475b;
  }
  .btn-secondary:hover { background: #e0e5e8; }

  .loading-note {
    text-align: center;
    color: #7a8a97;
    padding: 30px;
    font-size: 0.92rem;
  }

  .refresh-row {
    text-align: right;
    margin-bottom: 10px;
  }
  .refresh-row button {
    background: none;
    border: none;
    color: var(--mac-blue);
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
  }

  footer {
    text-align: center;
    color: #93a3ae;
    font-size: 0.78rem;
    margin-top: 26px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Nursing Open Lab Sign-Up</h1>
    <p>Pick a 30-minute time slot below. Each slot holds up to 15 students — once it's full, it will show as closed.</p>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <div class="refresh-row">
    <button onclick="loadSlots()">↻ Refresh availability</button>
  </div>

  <div id="slotsContainer">
    <div class="loading-note">Loading available times…</div>
  </div>

  <div id="signupPanel" class="signup-panel">
    <h2>Reserve your spot</h2>
    <div id="selectedSlotLabel" class="selected-slot-label"></div>
    <form id="signupForm">
      <div class="form-group">
        <label for="studentName">Full Name</label>
        <input type="text" id="studentName" required autocomplete="name" placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label for="studentEmail">Email</label>
        <input type="email" id="studentEmail" required autocomplete="email" placeholder="jsmith@mtaloy.edu">
      </div>
      <div class="btn-row">
        <button type="button" class="btn-secondary" onclick="closeSignupPanel()">Cancel</button>
        <button type="submit" class="btn-primary" id="submitBtn">Confirm Sign-Up</button>
      </div>
    </form>
  </div>

  <footer>Open Lab scheduling tool &middot; questions about lab hours go to your course instructor</footer>
</div>

<script>
  // ============================================================
  // REQUIRED SETUP: paste your Google Apps Script Web App URL here
  // (see README.md — Step 3). It must end in /exec
  // ============================================================
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOhPJakln_T6DKOOTrmaJZax3LE70_uRDb-I8V0ujZRcX6I-51iH3sm4X011als4Ej/exec';

  // How many days ahead to show students at a time (a rolling window from
  // whenever the page loads). SEMESTER_END_DATE in Code.gs is still a hard
  // backstop — even if this number is large, the page will never show past
  // that date.
  const DAYS_AHEAD = 21;

  let slotsData = [];       // raw response from the sheet
  let selectedSlot = null;  // { date, dateLabel, timeLabel }

  document.addEventListener('DOMContentLoaded', loadSlots);

  async function loadSlots() {
    const container = document.getElementById('slotsContainer');
    container.innerHTML = '<div class="loading-note">Loading available times…</div>';
    closeSignupPanel();

    try {
      const res = await fetch(`${SCRIPT_URL}?action=getSlots&days=${DAYS_AHEAD}`);
      const data = await res.json();

      if (!data.success) {
        throw new Error(data.error || 'Unknown error');
      }

      slotsData = data.days || [];
      renderSlots();
    } catch (err) {
      container.innerHTML = `<div class="empty-note">Couldn't load lab times right now. Please refresh, or check back in a few minutes. (${escapeHtml(err.message)})</div>`;
      console.error(err);
    }
  }

  function renderSlots() {
    const container = document.getElementById('slotsContainer');

    const daysWithSlots = slotsData.filter(d => d.slots && d.slots.length > 0);

    if (daysWithSlots.length === 0) {
      container.innerHTML = '<div class="empty-note">No open lab times are currently scheduled. Check back soon, or contact your instructor.</div>';
      return;
    }

    let html = '';
    daysWithSlots.forEach((day, idx) => {
      const openAttr = idx === 0 ? 'open' : '';
      html += `<details class="day-card" ${openAttr}>
        <summary>${escapeHtml(day.dateLabel)} <span class="chev">▶</span></summary>
        <div class="slot-grid">`;

      day.slots.forEach(slot => {
        const full = slot.spotsLeft <= 0;
        const low = !full && slot.spotsLeft <= 3;
        const cls = full ? 'full' : (low ? 'low' : '');
        const spotsText = full ? 'Full' : `${slot.spotsLeft} spot${slot.spotsLeft === 1 ? '' : 's'} left`;
        html += `<button type="button" class="slot-btn ${cls}"
                    ${full ? 'disabled' : ''}
                    onclick="selectSlot('${day.date}', '${escapeAttr(day.dateLabel)}', '${escapeAttr(slot.label)}', this)">
                    <span class="time">${escapeHtml(slot.label)}</span>
                    <span class="spots">${spotsText}</span>
                  </button>`;
      });

      html += `</div></details>`;
    });

    container.innerHTML = html;
  }

  function selectSlot(date, dateLabel, timeLabel, btnEl) {
    document.querySelectorAll('.slot-btn.selected').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');

    selectedSlot = { date, dateLabel, timeLabel };

    document.getElementById('selectedSlotLabel').textContent = `${dateLabel} — ${timeLabel}`;
    document.getElementById('signupPanel').classList.add('show');
    document.getElementById('signupPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function closeSignupPanel() {
    selectedSlot = null;
    document.getElementById('signupPanel').classList.remove('show');
    document.querySelectorAll('.slot-btn.selected').forEach(b => b.classList.remove('selected'));
    document.getElementById('signupForm').reset();
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedSlot) return;

    const name = document.getElementById('studentName').value.trim();
    const email = document.getElementById('studentEmail').value.trim();
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Reserving…';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
        body: JSON.stringify({
          action: 'signup',
          name: name,
          email: email,
          date: selectedSlot.date,
          timeLabel: selectedSlot.timeLabel
        })
      });

      const data = await res.json();

      if (data.success) {
        showBanner(`You're signed up for ${selectedSlot.dateLabel} — ${selectedSlot.timeLabel}. A confirmation was recorded for ${escapeHtml(email)}.`, 'success');
        closeSignupPanel();
        await loadSlots();
      } else {
        showBanner(data.error || 'That slot just filled up — please pick another time.', 'error');
        await loadSlots();
      }
    } catch (err) {
      showBanner('Something went wrong submitting your sign-up. Please try again.', 'error');
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm Sign-Up';
    }
  });

  function showBanner(msg, type) {
    const banner = document.getElementById('statusBanner');
    banner.textContent = msg;
    banner.className = `status-banner show ${type}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(() => { banner.classList.remove('show'); }, 8000);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  function escapeAttr(text) {
    return String(text).replace(/'/g, "\\'");
  }
</script>

</body>
</html>
